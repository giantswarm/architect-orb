# Command: determine-catalog-name
#
# Chooses the app catalog a chart is pushed to and writes it to
# .app_catalog_name, the pipeline's reference (tag or commit) to .reference.
# A tag pipeline releases to app_catalog, unless the tag's version carries a
# pre-release (v1.2.3-rc.1): a release candidate goes to app_catalog_test like
# every branch build. The logic is src/scripts/determine-catalog-name.sh, tested
# by src/tests/determine-catalog-name.bats.
parameters:
  app_catalog:
    type: "string"
  app_catalog_test:
    type: "string"
  on_tag:
    type: boolean
    default: true
    description: |
      When this is `false`, commits to `master` will be pushed to `app_catalog` instead of `app_catalog_test`.
      Set this to `false` for deployments that follow a a master branch for production releases rather than
      using tags (the default).
steps:
  - run:
      name: "architect/determine-catalog-name: Determine the target app catalog"
      environment:
        PARAM_APP_CATALOG: << parameters.app_catalog >>
        PARAM_APP_CATALOG_TEST: << parameters.app_catalog_test >>
        PARAM_ON_TAG: << parameters.on_tag >>
      command: <<include(scripts/determine-catalog-name.sh)>>
