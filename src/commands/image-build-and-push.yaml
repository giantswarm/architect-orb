parameters:
  image:
    type: string
  tag-latest-branch:
    type: string
    default: ""
  tag-suffix:
    type: string
    default: ""
  build-context:
    type: string
    default: "."
  dockerfile:
    type: string
    default: "./Dockerfile"
  registries-data:
    default: ""
    description: |
      A string that defines configuration for registries
      Each line describes one registry using the following format
      visibility registry username_envvar password_envvar push_dev_image
    type: string
  force-public:
    type: boolean
    default: false
  platforms:
    description: |
      Comma-separated list of platforms for multi-arch image build (e.g.,
      'linux/amd64,linux/arm64'). When empty, the list is auto-derived from the `.platforms`
      file written by `go-build` to the workspace. Falls back to 'linux/amd64,linux/arm64'
      if neither is available.
    type: string
    default: ""
  annotations:
    description: |
      Newline-separated OCI annotations passed to 'docker buildx build --annotation'.
      Each line uses the buildx format '[type:]key=value'. For multi-arch builds:
        manifest:key=value            - annotates each platform manifest
        index:key=value               - annotates the manifest list (OCI index)
        manifest-descriptor:key=value - annotates descriptors in the index
        key=value (no prefix)         - defaults to index for multi-platform builds
    type: string
    default: ""
  oci-labels:
    description: |
      Emit standard OCI image labels and matching index annotations
      (org.opencontainers.image.{source,revision,version,created}) derived from the
      CircleCI build context.
    type: boolean
    default: true
  provenance:
    description: |
      Buildx SLSA provenance attestation mode.
      - "min" (default): minimal provenance, attached as inline attestation manifest.
      - "max": rich provenance with full BuildKit args / source provenance.
      - "false": disable provenance attestation entirely (cleaner manifest list).
    type: enum
    enum: ["min", "max", "false"]
    default: "min"
  sbom:
    description: |
      Generate and attach a Software Bill of Materials (SPDX) attestation per platform.
      On public images, when `sign` is true, the exact SPDX predicate buildx produced is
      additionally signed as a cosign keyless attestation (`--type spdxjson`) so consumers
      can cryptographically verify its origin (see `sign`).
    type: boolean
    default: true
  sbom-cyclonedx:
    description: |
      Additionally generate a CycloneDX SBOM per architecture (with syft). BuildKit's
      `--attest type=sbom` only emits SPDX, so CycloneDX is produced out-of-band.
      - Public images with `sign: true`: the SBOM is signed as a cosign keyless
        attestation (`--type cyclonedx`) — a verifiable, trustable referrer.
      - Otherwise (private images, or `sign: false`): the SBOM is attached unsigned as an
        OCI referrer (artifactType `application/vnd.cyclonedx+json`) using oras, since
        signing private artifacts would leak their digests/timestamps into the public
        Rekor transparency log.
      Requires syft and oras in the architect image.
    type: boolean
    default: false
  sign:
    description: |
      Sign the pushed image manifest — and its SPDX / CycloneDX SBOM attestations — with
      cosign keyless OIDC. Public images only — private images are skipped at runtime to
      avoid leaking digests/timestamps into the public Rekor transparency log. Mints a
      fresh CircleCI OIDC token with audience=sigstore via `circleci run oidc get` so
      Fulcio's federation accepts it.
    type: boolean
    default: true
  split-china-push:
    description: Use self-hosted CircleCI runner in China for pushing image to Aliyun.
    type: boolean
    default: false
  push:
    description: |
      Push the built image to the configured registries (default). Set to false to only
      validate that the image builds for every target platform: the result stays in the
      BuildKit cache (multi-platform images cannot be loaded into the docker image store),
      no registry credentials are needed, and signing / provenance / SBOM generation are
      skipped — those only make sense on a published image.
    type: boolean
    default: true
  cache:
    description: |
      BuildKit layer-cache backend for the buildx build.
      - "off" (default): no cache import/export. Every job gets a fresh
        `setup_remote_docker` VM and a fresh `docker-container` builder, so the whole
        Dockerfile is re-executed from scratch on every build.
      - "registry": import and export the layer cache as an OCI artifact in the same
        registry the image is pushed to (`--cache-from` / `--cache-to type=registry`).
        Requires `push: true`, because the export reuses the registry credentials the
        push path already set up.
      Note: `RUN --mount=type=cache` mounts are NOT part of the exported cache — only
      layers are. A layer cache *hit* skips the `RUN` entirely (so its cache mount is
      irrelevant); a *miss* re-runs it against a cold mount.
    type: enum
    enum: ["off", "registry"]
    default: "off"
  cache-ref:
    description: |
      Explicit OCI ref for the `cache: registry` cache artifact. When empty (default),
      it is derived as `<registry>/<image>:buildcache<tag-suffix>`, where `<registry>` is
      the visibility-matched entry, preferring gsoci/gsociprivate and never the China
      mirror (see the derivation comment in the build step). That is one shared cache per
      image, written by every build of the repo; set this to scope it differently (e.g.
      per branch). The ref holds a cache manifest and blobs, not a runnable image.
    type: string
    default: ""
steps:
  - when:
      # The GitHub token is only needed for the repo-visibility check, which only
      # matters when registries are selected for pushing.
      condition: <<parameters.push>>
      steps:
        - generate-github-token
        - image-select-registries:
            force-public: <<parameters.force-public>>
            registries-data: <<parameters.registries-data>>
            split-china-push: <<parameters.split-china-push>>
  - run:
      name: Build multi-arch image (pushed to all registries unless push=false)

      # Cross-platform builds may be slower (e.g. `GOARCH=arm64 go build` from another architecture)
      no_output_timeout: 20m

      command: |
        # The buildx invocation below is piped through `tee`, so the build's exit status
        # only survives with pipefail. CircleCI's default shell already sets it and no
        # executor here overrides `shell:`; setting it explicitly keeps this script from
        # depending on that default, since losing it would mask every build failure
        # behind tee's exit 0.
        set -o pipefail

        # Determine tag value from tag_envvar or fallback
        TAG_VALUE="${DOCKER_IMAGE_TAG}"
        tag_suffix="<<parameters.tag-suffix>>"
        tag_latest_branch="<<parameters.tag-latest-branch>>"

        # Resolve platforms: explicit param > .platforms in workspace > built-in default
        platforms="<<parameters.platforms>>"
        if [[ -z "$platforms" && -f .platforms ]]; then
          platforms=$(paste -sd, .platforms | tr -d '[:space:]')
        fi
        if [[ -z "$platforms" ]]; then
          platforms="linux/amd64,linux/arm64"
        fi
        echo "Building for platforms: $platforms"

        oci_label_flags=()
        if [[ "<<parameters.oci-labels>>" == "true" ]]; then
          oci_source="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
          # Prefer the commit timestamp so rebuilds of the same SHA produce identical labels.
          oci_created="$(git show -s --format=%cI "$CIRCLE_SHA1" 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
          oci_version="${TAG_VALUE:-}"
          oci_label_flags+=(
            --label "org.opencontainers.image.source=${oci_source}"
            --label "org.opencontainers.image.revision=${CIRCLE_SHA1}"
            --label "org.opencontainers.image.created=${oci_created}"
            --annotation "index:org.opencontainers.image.source=${oci_source}"
            --annotation "index:org.opencontainers.image.revision=${CIRCLE_SHA1}"
            --annotation "index:org.opencontainers.image.created=${oci_created}"
          )
          if [[ -n "$oci_version" ]]; then
            oci_label_flags+=(
              --label "org.opencontainers.image.version=${oci_version}"
              --annotation "index:org.opencontainers.image.version=${oci_version}"
            )
          fi
        fi

        if [[ "<<parameters.push>>" == "false" ]]; then
          # Build-only mode: no registry selection, no credentials, a single local
          # (discarded) tag. The visibility check and registries data are irrelevant
          # because nothing leaves the BuildKit cache.
          echo "push=false: build-only validation, nothing will be pushed."
          all_tags=("--tag" "<<parameters.image>>:${TAG_VALUE}")
          push_flags=()
        else
          push_flags=(--push)

          # Read these, never re-derive them: a second derivation can disagree with
          # the pushed set, and the signing steps read these same files.
          IMAGE_ACCESS=$(cat /tmp/.image_access)
          cache_registry=$(cat /tmp/.cache_registry)

          # Collect all tags
          tags=("<<parameters.image>>:${TAG_VALUE}")
          if [[ "$CIRCLE_BRANCH" == "$tag_latest_branch" ]]; then
            tags+=("<<parameters.image>>:latest$tag_suffix")
          fi

          # Any filter that decides the set belongs in image-select-registries, not here.
          all_tags=()
          while IFS= read -r reg; do
            [[ -z "$reg" ]] && continue
            for tag in "${tags[@]}"; do
              echo -e "\nProcessing image push config for registry $reg."
              echo "Tag the image for $reg"
              echo "Preparing tag for $reg: <<parameters.image>>:${tag##*:}"
              all_tags+=("--tag" "$reg/<<parameters.image>>:${tag##*:}")
            done
          done < /tmp/.eligible_registries

          if [[ ${#all_tags[@]} -eq 0 ]]; then
            echo "No valid registry/tag combinations found for push. Exiting."
            exit 1
          fi
        fi

        # Register QEMU/binfmt handlers in the kernel so buildx can execute
        # non-host-arch RUN steps. Required for plain Dockerfiles that don't
        # gate RUN with --platform=$BUILDPLATFORM.
        #
        # Skipped when every target platform already matches the build host: no RUN
        # step can be emulated then, so registering binfmt only costs a privileged
        # image pull. Single-arch repos (`platforms: linux/amd64`) paid this on every
        # build. If the host platform can't be determined we register anyway, keeping
        # the previous unconditional behaviour rather than risking an un-emulated
        # cross build.
        host_platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}' 2>/dev/null || true)"
        needs_emulation=false
        if [[ -z "$host_platform" ]]; then
          echo "Could not determine the build host platform; registering QEMU/binfmt to be safe."
          needs_emulation=true
        else
          # Comma-to-space word splitting rather than a bash herestring: the herestring
          # operator is also CircleCI's parameter-substitution token and cannot appear
          # unescaped in an orb command. Platform strings never contain spaces or globs.
          for target_platform in ${platforms//,/ }; do
            if [[ "$target_platform" != "$host_platform" ]]; then
              needs_emulation=true
            fi
          done
        fi

        if [[ "$needs_emulation" == "true" ]]; then
          # Image is pinned via tag and bumped by Renovate.
          # renovate: datasource=docker depName=tonistiigi/binfmt
          docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install all
        else
          echo "All target platforms match the build host ($host_platform); skipping QEMU/binfmt registration."
        fi

        # Reuse the builder if it already exists; create otherwise. Bootstrap
        # ensures the buildkit container is up before the first build.
        #
        # NOTE on attestation storage: BuildKit (and `docker buildx --attest`)
        # store SLSA provenance and SBOM attestations *inline* in the image
        # index — this is what produces the `unknown/unknown` manifest entries
        # that show up in `docker manifest inspect` output. As of writing,
        # BuildKit does NOT support OCI 1.1 referrer storage for attestations:
        #   - https://docs.docker.com/build/metadata/attestations/attestation-storage/
        #     ("In the future, we may support exporting attestations in
        #      additional formats.")
        #   - The `--attest` flag has no `referrer` / `referrers` attribute.
        #   - `buildkitd.toml` has no `[attestation]` section.
        # Cosign signatures DO land as referrers because cosign uses its own
        # OCI 1.1 referrer push path (independent of BuildKit). Revisit this
        # comment when BuildKit ships referrer-mode attestation storage.
        if ! docker buildx inspect multiarch-builder >/dev/null 2>&1; then
          docker buildx create --name multiarch-builder --driver docker-container --use
        else
          docker buildx use multiarch-builder
        fi
        docker buildx inspect --bootstrap

        annotation_flags=()
        annotations_input="<<parameters.annotations>>"
        if [[ -n "$annotations_input" ]]; then
          printf '%s\n' "$annotations_input" > .annotations_input
          while IFS= read -r line; do
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            annotation_flags+=("--annotation" "$line")
          done < .annotations_input
          rm -f .annotations_input
        fi

        # SLSA provenance and SBOM attestations. The buildkitd builder config
        # written above tells BuildKit to store these as OCI 1.1 referrer
        # artifacts when the target registry supports them (ACR/gsoci, GHCR,
        # recent Quay), keeping the image index clean. Falls back to inline
        # attestation manifests if the registry doesn't advertise referrer
        # support.
        attest_flags=()
        if [[ "<<parameters.push>>" == "false" ]]; then
          # Attestations only make sense on a published image; in build-only mode
          # they would be computed and immediately discarded with the cache.
          attest_flags+=("--provenance=false" "--sbom=false")
        else
          case "<<parameters.provenance>>" in
            "min")   attest_flags+=("--attest" "type=provenance,mode=min") ;;
            "max")   attest_flags+=("--attest" "type=provenance,mode=max") ;;
            "false") attest_flags+=("--provenance=false") ;;
          esac
          if [[ "<<parameters.sbom>>" == "true" ]]; then
            attest_flags+=("--attest" "type=sbom")
          else
            attest_flags+=("--sbom=false")
          fi
        fi

        # BuildKit layer cache. The builder is created fresh on a fresh remote-docker
        # VM every job, so without an external cache backend the entire Dockerfile is
        # re-executed every build. The registry exporter persists the layer cache as an
        # OCI artifact alongside the image.
        cache_flags=()
        if [[ "<<parameters.cache>>" == "registry" ]]; then
          if [[ "<<parameters.push>>" != "true" ]]; then
            echo "cache=registry needs push=true for registry credentials; continuing without a layer cache."
          else
            # cache_registry is picked in the single pass over .registries_data above.
            cache_ref="<<parameters.cache-ref>>"
            if [[ -z "$cache_ref" ]]; then
              if [[ -n "$cache_registry" ]]; then
                cache_ref="${cache_registry}/<<parameters.image>>:buildcache${tag_suffix}"
              else
                echo "No $IMAGE_ACCESS registry eligible to host the layer cache; continuing without one."
              fi
            fi
            if [[ -n "$cache_ref" ]]; then
              echo "Using registry layer cache: $cache_ref"
              # mode=max exports intermediate layers too. That is the whole point here —
              # the expensive steps (apt/pip/npm installs) are intermediate, and the
              # default `min` would export only final-image layers, so it is not offered.
              # image-manifest + oci-mediatypes: ACR (gsoci/gsociprivate) rejects the
              # exporter's default manifest-list format, so the cache must be pushed as a
              # plain OCI image manifest.
              # ignore-error: a failed *export* must never fail the build — the image
              # itself is already pushed by then, and the outer retry loop would otherwise
              # rebuild four times over a cache write problem. The trade-off is that the
              # failure is invisible, so it is detected and warned about after the build.
              cache_flags+=("--cache-from" "type=registry,ref=${cache_ref}")
              cache_flags+=("--cache-to" "type=registry,ref=${cache_ref},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true")
            fi
          fi
        fi

        # Single buildx build/push for all tags/registries.
        # --metadata-file captures the manifest index digest for downstream cosign signing.
        SUCCESS=false
        for i in {1..4}; do
          echo "attempt: $i for all registries/tags"
          if docker buildx build \
            --platform "$platforms" \
            "${all_tags[@]}" \
            "${annotation_flags[@]}" \
            "${oci_label_flags[@]}" \
            "${attest_flags[@]}" \
            "${cache_flags[@]}" \
            --metadata-file=/tmp/.buildx_metadata.json \
            -f "<<parameters.dockerfile>>" \
            "<<parameters.build-context>>" \
            --progress=plain \
            "${push_flags[@]}" 2>&1 | tee /tmp/.buildx_output; then
            SUCCESS=true
            break
          fi
          echo "Waiting 5 seconds before the next attempt."
          sleep 5
        done

        if [[ "$SUCCESS" == "false" ]]; then
          echo "buildx build failed. Check buildx output above."
          exit 1
        fi

        # `ignore-error=true` on the cache exporter means a rejected export (registry
        # policy, quota, an auth scope that covers image push but not the cache repo)
        # leaves the build green while every later build silently reverts to full cost.
        # Worse, the exporter retries with escalating backoff before giving up, so a
        # persistently failing cache registry adds minutes per build and reports nothing.
        #
        # buildx prints a fenced `> exporting cache to registry:` section only when that
        # vertex failed; a successful export never emits it. Verified against both a
        # rejected export (ACR `insufficient_scope`) and a successful one.
        if [[ ${#cache_flags[@]} -gt 0 ]] && grep -qE '^[[:space:]]*> exporting cache to registry:' /tmp/.buildx_output; then
          echo ""
          echo "WARNING: the image was pushed, but the BuildKit cache export FAILED."
          echo "WARNING: ignore-error=true kept this build green. Every subsequent build"
          echo "WARNING: will pay the full uncached cost until this is fixed."
          echo "WARNING: cache ref: ${cache_ref:-<unset>}"
          echo "WARNING: see the 'exporting cache to registry' section in the build output."
          echo ""
        fi

        if [[ "<<parameters.push>>" == "false" ]]; then
          echo "Image built successfully for all platforms; nothing was pushed (push=false)."
          exit 0
        fi
        echo "Image is pushed to all registries."

        # Persist the index digest for image-sign-and-attest.
        # The manifest index digest is content-addressed — identical across every
        # registry we pushed to — so compute it once here and let both downstream
        # steps read it rather than re-deriving the same value from the metadata.
        index_digest=$(jq -r '."containerimage.descriptor".digest // empty' /tmp/.buildx_metadata.json)
        if [[ -z "$index_digest" ]]; then
          echo "Could not extract index digest from buildx metadata:"
          cat /tmp/.buildx_metadata.json
          exit 1
        fi
        echo -n "$index_digest" > /tmp/.index_digest
        echo "Index digest: $index_digest"
  # Signs the index, signs or attaches the per-architecture SBOMs, and clears the
  # inter-step scratch files. Invoked unconditionally: the signing work carries
  # its own conditions, and the cleanup inside runs `when: always`, so build-only
  # and failed runs still leave nothing behind for an unrelated rerun.
  - image-sign-and-attest:
      image: <<parameters.image>>
      push: <<parameters.push>>
      sign: <<parameters.sign>>
      sbom: <<parameters.sbom>>
      sbom-cyclonedx: <<parameters.sbom-cyclonedx>>
