parameters:
  chart:
    description: "Name of the chart inside helm directory to build."
    type: "string"
  override_chart_version:
    type: boolean
    default: true
    description: |
      **Deprecated.** This parameter has no effect anymore and is always treated as
      `true`; it is kept for backwards compatibility and will be removed in a future
      version.  The chart version is always stamped with the value computed by
      `gitsemver` (or read from the `.build_version` workspace file).

      Setting it to `false` used to leave the version declared in `Chart.yaml`
      unchanged, which allowed a branch build to publish a plain release version and
      overwrite the already-published chart at that version in the OCI registry.
  override_app_version:
    type: boolean
    default: true
    description: |
      When `true`, passes `--override-app-version <version>` to App Build Suite,
      stamping the app version with the value computed by `gitsemver` (or read
      from the `.build_version` workspace file).  Set to `false` to leave the
      appVersion declared in `Chart.yaml` unchanged.
steps:
  - run:
      name: "architect/package-helm-with-abs: Execute App Build Suite"
      command: |
        set -euo pipefail
        if [ ! -f .app_catalog_name ]; then
          echo "ERROR: .app_catalog_name not found — run determine-catalog-name before this command"
          exit 1
        fi
        # The chart version is always stamped from the computed build version. The
        # `override_chart_version` parameter is deprecated and ignored: leaving the
        # version from `Chart.yaml` in place let a branch build publish a plain
        # release version, overwriting the released chart at that version in the OCI
        # registry (`push-helm` pushes to the same repo path for every build).
        if [ -f .build_version ]; then
          VERSION=$(tr -d "\n" < .build_version)
        else
          VERSION=$(gitsemver get | tr -d "\n")
        fi
        if [ -z "${VERSION}" ]; then
          echo "ERROR: could not determine build version (.build_version is empty and gitsemver returned nothing)"
          exit 1
        fi
        if [ "<< parameters.override_chart_version >>" != "true" ]; then
          echo "NOTE: 'override_chart_version' is deprecated and ignored; stamping chart version ${VERSION} anyway."
        fi
        OVERRIDES="--override-chart-version ${VERSION}"
        if [ "<< parameters.override_app_version >>" = "true" ]; then
          OVERRIDES="${OVERRIDES} --override-app-version ${VERSION}"
        fi
        mkdir -p build && python -m app_build_suite \
          --chart-dir ./helm/<< parameters.chart >> \
          --destination build \
          --generate-metadata \
          --catalog-base-url "https://giantswarm.github.io/$(cat .app_catalog_name)/" \
          --keep-chart-changes \
          ${OVERRIDES}
