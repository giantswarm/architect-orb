# Command: image-merge-manifests
#
# Joins the per-architecture digests recorded by the build jobs into one tagged OCI
# index per eligible registry, using `docker buildx imagetools create`.
#
# Why imagetools and not `docker manifest create`: each build pushed an index
# containing its image manifest AND its attestation manifest. imagetools copies
# the whole child index, preserving the attestation manifests and the
# vnd.docker.reference.* annotations that link each one to the platform manifest
# it describes. `docker manifest create` strips them, which would silently break
# the SPDX signing in image-sign-and-attest.
#
# Why once per registry: imagetools create builds a manifest by reference and
# requires its sources to already exist in the registry it writes to — it relies
# on same-host cross-repository blob mounting and has no cross-registry
# equivalent. Each build therefore pushes its digest to every eligible registry,
# and this runs once per registry against digests that are identical everywhere.
#
# Requires image-select-registries and a workspace containing .image-digests/
# from every architecture.
#
# Writes:
#   /tmp/.index_digest   the merged index digest, verified identical at every
#                        registry, for image-sign-and-attest to consume
parameters:
  image:
    description: Name of the container repository and image. Must not contain registry host name!
    type: string
  platforms:
    description: |
      Comma-separated list of the platforms that were built, e.g.
      `linux/amd64,linux/arm64`. Resolved exactly as `image-build-and-push`
      resolves its build platforms: this value if non-empty, else the `.platforms`
      file `go-build` writes to the workspace, else `linux/amd64,linux/arm64`.

      The set must match the build jobs exactly: a platform with no digest fails
      the merge rather than publishing an index that is quietly missing an
      architecture, and a digest with no matching platform fails it rather than
      silently leaving that architecture out.
    type: string
    default: ""
  tag-latest-branch:
    description: 'Name of the branch on which the image will be additionally tagged as "latest".'
    type: string
    default: ""
  tag-suffix:
    type: string
    default: ""
  annotations:
    description: |
      Newline-separated OCI annotations for the merged index. Only the prefixes
      `imagetools create` accepts are allowed: `index:`, `index-descriptor:` and
      `manifest-descriptor:`. A bare key or a `manifest:` prefix is rejected by
      buildx with a cryptic error, so this command rejects them with a clear one.
    type: string
    default: ""
  oci-labels:
    description: |
      Emit org.opencontainers.image.{source,revision,version,created} as index
      annotations. The matching image *labels* are set per architecture by the
      build jobs; index annotations have to be re-applied here, because the
      merge builds a new index and the per-architecture ones are discarded with
      the per-architecture indexes.
    type: boolean
    default: true
steps:
  - run:
      name: "architect/image-merge-manifests: Merge the per-architecture digests into a tagged index"
      command: |
        set -o pipefail

        TAG_VALUE="${DOCKER_IMAGE_TAG}"
        tag_suffix="<<parameters.tag-suffix>>"
        tag_latest_branch="<<parameters.tag-latest-branch>>"

        # Resolve platforms the way the build path does: explicit param > .platforms
        # in the workspace > built-in default. Same rule on both paths, so a repo
        # that never set `platforms` gets the same answer whichever way it builds.
        platforms_list="<<parameters.platforms>>"
        if [[ -z "$platforms_list" && -f .platforms ]]; then
          platforms_list=$(paste -sd, .platforms | tr -d '[:space:]')
        fi
        if [[ -z "$platforms_list" ]]; then
          platforms_list="linux/amd64,linux/arm64"
        fi
        echo "Expecting a digest for each of: ${platforms_list}"
        if [[ ! "$platforms_list" =~ ^[a-zA-Z0-9/_,.-]+$ ]]; then
          echo "ERROR: 'platforms' must be a comma-separated list of valid platform"
          echo "strings (e.g. linux/amd64,linux/arm64), got '${platforms_list}'."
          exit 1
        fi

        # Sources: one digest per expected platform. A missing digest means a build
        # did not run, did not push, or did not persist its workspace -- all of
        # which would otherwise produce a perfectly valid index that is quietly
        # missing an architecture, published under the release tag.
        sources=()
        expected=()
        # Comma-to-space word splitting rather than a herestring: the herestring
        # operator is also CircleCI's parameter-substitution token and cannot appear
        # unescaped in an orb command. The charset check above rules out globs.
        # Must match the namespacing in the build command: image plus tag-suffix, so two
        # builds in one pipeline stay separate.
        digest_dir=".image-digests/$(echo "<<parameters.image>>${tag_suffix}" | tr '/:' '__')"
        for platform in ${platforms_list//,/ }; do
          safe_platform=$(echo "$platform" | tr '/:.' '___')
          digest_file="${digest_dir}/${safe_platform}"
          if [[ ! -s "$digest_file" ]]; then
            echo "ERROR: no digest recorded for ${platform} (expected ${digest_file})."
            echo ""
            echo "Every platform in 'platforms' needs an architect/build-image job that"
            echo "pushed and persisted its workspace. Refusing to publish a partial index."
            echo ""
            echo "If this job is not meant to have build-image jobs, drop merge-digests: true"
            echo "and push-to-registries builds the image itself. See"
            echo "https://github.com/giantswarm/architect-orb/blob/main/docs/job/push-to-registries.md#native-per-architecture-builds-opt-in"
            echo ""
            echo "Digests present:"
            find .image-digests -type f 2>/dev/null || echo "  (none)"
            exit 1
          fi
          digest=$(cat "$digest_file")
          echo "${platform}: ${digest}"
          sources+=("$digest")
          expected+=("$safe_platform")
        done

        # The other direction: a digest nobody asked for means an architecture was
        # built and then left out of the published index. That is as quiet a failure
        # as a missing one, and it is the shape a half-finished `platforms` edit takes.
        for digest_file in "${digest_dir}"/*; do
          [[ -e "$digest_file" ]] || continue
          found="$(basename "$digest_file")"
          match=false
          for safe_platform in "${expected[@]}"; do
            [[ "$found" == "$safe_platform" ]] && match=true && break
          done
          if [[ "$match" == "false" ]]; then
            echo "ERROR: a digest was recorded for '${found}', which is not in 'platforms'."
            echo "That architecture was built and pushed but would be left out of the index."
            echo "Add it to 'platforms', or remove its build job."
            exit 1
          fi
        done

        # Index annotations. imagetools create only accepts these prefixes; a bare
        # key or `manifest:` fails with `"" annotations are not supported yet`.
        annotation_flags=()
        if [[ "<<parameters.oci-labels>>" == "true" ]]; then
          oci_source="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
          oci_created="$(git show -s --format=%cI "$CIRCLE_SHA1" 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
          annotation_flags+=(
            --annotation "index:org.opencontainers.image.source=${oci_source}"
            --annotation "index:org.opencontainers.image.revision=${CIRCLE_SHA1}"
            --annotation "index:org.opencontainers.image.created=${oci_created}"
          )
          if [[ -n "${TAG_VALUE:-}" ]]; then
            annotation_flags+=(--annotation "index:org.opencontainers.image.version=${TAG_VALUE}")
          fi
        fi

        annotations_input="<<parameters.annotations>>"
        if [[ -n "$annotations_input" ]]; then
          printf '%s\n' "$annotations_input" > .annotations_input
          while IFS= read -r line; do
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            case "$line" in
              index:*|index-descriptor:*|manifest-descriptor:*) ;;
              *)
                echo "ERROR: annotation '${line}' is not usable on a merged index."
                echo "imagetools create accepts only index:, index-descriptor: and"
                echo "manifest-descriptor: prefixes. Per-platform manifest annotations"
                echo "belong on the architect/build-image jobs instead."
                rm -f .annotations_input
                exit 1
                ;;
            esac
            annotation_flags+=("--annotation" "$line")
          done < .annotations_input
          rm -f .annotations_input
        fi

        # Tags. The `latest` rule is deliberately the same comparison as the
        # single-job path in image-build-and-push, including its edge: on a tag
        # build CIRCLE_BRANCH is empty and an unset tag-latest-branch is empty too,
        # so every release build also gets `latest`. That is what every consumer
        # gets today, and merge-digests must not change which tags a release
        # carries. Tightening the rule (a `-n` guard) is a change to both paths at
        # once, tracked separately: https://github.com/giantswarm/architect-orb/issues/914
        tags=("${TAG_VALUE}")
        if [[ "$CIRCLE_BRANCH" == "$tag_latest_branch" ]]; then
          tags+=("latest${tag_suffix}")
        fi

        merged=()
        digests=()
        while IFS= read -r reg; do
          [[ -z "$reg" ]] && continue
          ref="${reg}/<<parameters.image>>"

          tag_flags=()
          for tag in "${tags[@]}"; do
            tag_flags+=("--tag" "${ref}:${tag}")
          done

          source_refs=()
          for digest in "${sources[@]}"; do
            source_refs+=("${ref}@${digest}")
          done

          echo ""
          echo "Creating ${ref}:${tags[0]} from ${#source_refs[@]} platform digests"
          docker buildx imagetools create \
            "${annotation_flags[@]}" \
            "${tag_flags[@]}" \
            "${source_refs[@]}"

          idx=$(docker buildx imagetools inspect "${ref}:${tags[0]}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ -z "$idx" || "$idx" == "null" ]]; then
            echo "Could not read the merged index digest for ${ref}:${tags[0]}."
            exit 1
          fi
          merged+=("${reg} ${idx}")
          digests+=("$idx")
        done < /tmp/.eligible_registries

        if [[ ${#digests[@]} -eq 0 ]]; then
          echo "No eligible registries recorded by image-select-registries. Exiting."
          exit 1
        fi
        printf '%s\n' "${merged[@]}"

        # image-sign-and-attest signs one digest against every registry, on the
        # grounds that an index is content-addressed and therefore identical
        # everywhere. That holds only if each merge produced byte-identical
        # content, so assert it here rather than discovering a per-registry digest
        # inside the signing code.
        distinct=$(printf '%s\n' "${digests[@]}" | sort -u | wc -l)
        if [[ "$distinct" -ne 1 ]]; then
          echo "ERROR: the merged index digest differs between registries:"
          printf '%s\n' "${merged[@]}"
          exit 1
        fi

        index_digest="${digests[0]}"
        echo -n "$index_digest" > /tmp/.index_digest
        echo "Index digest: ${index_digest}"
