# Command: image-prepare-tag
#
# Computes the build version from git state and publishes it to the rest of the job.
#
# Writes:
#   /tmp/.docker_image_tag   the resolved tag (gitsemver output plus tag-suffix)
#   DOCKER_IMAGE_TAG         the same value, exported through BASH_ENV
#   DOCKER_IMAGE_VERSION     the version without the tag-suffix, exported through
#                            BASH_ENV: the tag of a sibling image this pipeline
#                            builds without a suffix, for a Dockerfile that builds
#                            on it (build-args: BASE_VERSION=${DOCKER_IMAGE_VERSION})
#   .build_version           the same value in the workspace, unless
#                            persist-build-version is false
#
# A branch pipeline never resolves a release version. `gitsemver get` reads the
# git state alone, so at a commit that carries a release tag it yields that
# release version whichever ref triggered the pipeline; the rest of the job
# would then treat a branch build as the release and push the released image
# and chart again. When CIRCLE_TAG is empty and the version is not a dev
# version, the step fails naming the version and the branch, before anything is
# built. A tag pipeline is unchanged. The logic is src/scripts/image-prepare-tag.sh,
# tested by src/tests/image-prepare-tag.bats.
parameters:
  git-tag-prefix:
    description: |
      Tag prefix for mono repos, exported as GS_GIT_TAG_PREFIX before gitsemver
      runs. Empty on a single-project repo.

      It is set here rather than by the caller because gitsemver needs it in the
      same shell that computes the version, and a value written to BASH_ENV only
      reaches the next step.
    type: string
    default: ""
  tag-suffix:
    type: "string"
    default: ""
  persist-build-version:
    description: |
      Publish the computed version to the workspace as `.build_version`, where
      `package-helm-with-abs` picks it up to stamp chart versions.

      Set to false when several jobs that call this command run CONCURRENTLY:
      CircleCI refuses to attach a workspace that two concurrent jobs persisted
      the same path into. Exactly one job in a pipeline should persist it, and
      the value is deterministic for a given commit and tag-suffix, so it does
      not matter which.

      DOCKER_IMAGE_TAG and /tmp/.docker_image_tag are written either way — this
      controls only the workspace copy.
    type: boolean
    default: true
steps:
  - run:
      name: "architect/image-prepare-tag: Compute the build version from git state"
      environment:
        PARAM_GIT_TAG_PREFIX: <<parameters.git-tag-prefix>>
        PARAM_TAG_SUFFIX: <<parameters.tag-suffix>>
      command: <<include(scripts/image-prepare-tag.sh)>>
  - when:
      condition: <<parameters.persist-build-version>>
      steps:
        - run:
            name: "architect/image-prepare-tag: Write computed version to .build_version"
            command: cp /tmp/.docker_image_tag .build_version
        - persist_to_workspace:
            root: .
            paths:
              - .build_version
