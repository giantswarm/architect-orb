parameters:
  path:
    default: "."
    description: |
      The path where the Go package to test is located.
    type: string
  pre_test_target:
    default: ""
    description: |
      Executes the requested Makefile target before lints and tests. Helpful to generate code in advance.
    type: string
  test_target:
    default: ""
    description: |
      Executes the requested Makefile target.
    type: string
steps:
  # We set `CGO_ENABLED=0` because the `architect` Docker image does not have a C compiler. Most cases
  # should work without cgo.

  - when:
      condition: <<parameters.pre_test_target>>
      steps:
        - run:
            name: Run pre-test Makefile target
            environment:
              CGO_ENABLED: "0"
            command: |
              make <<parameters.pre_test_target>>
  - run:
      name: Check if go.mod and go.sum are clean
      command: |
        go mod tidy && git diff --exit-code

  - run:
      name: Create ldflags file
      command: |
        echo -n "-s -w -linkmode 'auto' -extldflags '-static'" > .ldflags

        # buildTimestamp
        echo -n " -X '$(go list "<<parameters.path>>")/pkg/project.buildTimestamp=$(date --utc '+%FT%TZ')'" >> .ldflags

        # Commit SHA
        echo -n " -X '$(go list "<<parameters.path>>")/pkg/project.gitSHA=${CIRCLE_SHA1}'" >> .ldflags

        # Version: on tag builds the release tag without its `v`, the form
        # the devctl Makefile stamps locally (`gitsemver get`) and kubectl-gs
        # keeps in its version const. Auto-release computes the tag with
        # git-cliff and never writes it into the sources, so without this
        # line a repo's `pkg/project.Version()` is left to its default ("dev",
        # a hardcoded -dev const) or to Go's VCS build info, which ignores
        # tags above the module's major (muster prints v1.12.1-0.… for
        # v5.10.3) and marks any untracked file as +dirty. Branch builds
        # leave the repo's default in place.
        if [ -n "${CIRCLE_TAG:-}" ]; then
          echo -n " -X '$(go list "<<parameters.path>>")/pkg/project.version=${CIRCLE_TAG#v}'" >> .ldflags
        fi

        # Print content
        echo "\"$(cat .ldflags)\""

        # .ldflags is untracked scratch that go-build reads back from the
        # working tree. Left visible to git it flips Go's buildvcs stamp to
        # vcs.modified=true and a binary that reports its version from the
        # module build info (no version const, e.g. auto-released CLIs)
        # prints vX.Y.Z+dirty. Ignored files never show in
        # `git status --porcelain`, which is what Go checks.
        if [ -d .git ] && ! grep -qxF '.ldflags' .git/info/exclude 2>/dev/null; then
          echo '.ldflags' >> .git/info/exclude
        fi

  - run:
      name: Check for non-ASCII characters in file names
      command: |
        checked=0
        non_ascii=0
        for entry in $(find -L)
        do
          checked=$((checked+1))
          if [[ "$entry" = *[![:ascii:]]* ]]; then
            non_ascii=$((non_ascii+1))
            echo "Found non-ASCII characters in filename: $entry"
          fi
        done
        echo "Found $non_ascii non-ASCII filenames in $checked files."
        exit $non_ascii
  - run:
      name: Check if Go code is formatted according to goimports
      command: |
        go install golang.org/x/tools/cmd/goimports@latest && \
        if [[ -n $(goimports -local github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME} -l .) ]];
        then
          goimports -local github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME} -d . && exit 1;
        fi
  - run:
      name: Check if code structure differs from gofmt's
      command: |
        test -z $(gofmt -l .) || gofmt -d .
  - when:
      condition: <<parameters.test_target>>
      steps:
        - run:
            name: Run unit tests via Makefile target
            environment:
              CGO_ENABLED: "0"
            command: |
              make <<parameters.test_target>>
  - unless:
      condition: <<parameters.test_target>>
      steps:
        - run:
            name: Run unit tests
            environment:
              CGO_ENABLED: "0"
            command: |
              go test -ldflags "$(cat .ldflags)" ./...
  - run:
      name: "architect/go-test: Run gosec on non test files"
      environment:
        CGO_ENABLED: "0"
      command: |
        golangci-lint run --no-config --default=none --enable=gosec \
          --tests=false --max-issues-per-linter=0 --max-same-issues=0
  - run:
      name: Check if dependencies have known security vulnerabilities
      environment:
        CGO_ENABLED: "0"
      command: |
        set +e
        # Write the scan log to /tmp, not the working tree: this command runs
        # between `make test` and the binary link, and a stray untracked file in
        # the repo makes Go's buildvcs stamp `vcs.modified=true`, so release
        # binaries report `vX.Y.Z+dirty`. Keep it out of the tree like the other
        # orb scratch files (/tmp/.cosign_blobs, /tmp/.gh_response_binsign).
        go list -json -deps ./... \
          | nancy sleuth --skip-update-check \
            --quiet --exclude-vulnerability-file ./.nancy-ignore \
            --additional-exclude-vulnerability-files ./.nancy-ignore.generated 2>&1 \
            | tee /tmp/nancy-results.txt ; nancy_result=(${PIPESTATUS[1]})
        grep -qF \
            -e 'error accessing OSS Index' \
            -e 'Error: guide API request failed' \
            /tmp/nancy-results.txt; grep_result=$?
        set -e
        # If nancy gave us a bad exit code AND grep found an OSS index error in the output, then we don't fail the build.
        if [[ $nancy_result -ne 0 && $grep_result -eq 0 ]]; then
          echo Ignoring failed scan due to problem with the external scanner.
          exit 0
        fi
        exit $nancy_result
