parameters:
  chart_archive_prefix:
    description: "Prefix for the chart archive file to execute tests for."
    type: string
    default: ""
  app-test-suite_version:
    description: "Version of app-test-suite dats.sh container wrapper to use (git tag or commit). Legacy path only: ignored on the kind path."
    type: string
  app-test-suite_container_tag:
    description: |
      Container tag of app-test-suite to use (check gsoci.azurecr.io/giantswarm/app-test-suite). The
      tag picks the path: a 0.x tag (`0.15.0`, `v0.15.0`, `0.15.0-<sha>`) takes the legacy path, which
      downloads dats.sh at app-test-suite_version and lets app-test-suite <= 0.15 create its own kind
      cluster through the Docker socket. Any other tag takes the kind path: the job creates a kind
      cluster and runs the app-test-suite image directly against it (app-test-suite >= 1.0, which no
      longer provisions clusters and no longer ships dats.sh).
    type: string
  additional_app-test-suite_flags:
    description: "Additional app-test-suite flags to use"
    type: string
    default: ""
  create_kind_cluster:
    description: |
      Deprecated: app-test-suite_container_tag picks the path. True forces the kind path also for a
      0.x tag; false (the default) leaves the choice to the tag.
    type: boolean
    default: false
  kind_version:
    description: "kind release to install on the kind path (https://github.com/kubernetes-sigs/kind/releases)."
    type: string
    default: "v0.33.0"
  kind_node_image:
    description: |
      Node image of the kind cluster created on the kind path. The Kubernetes
      version in its tag is passed to app-test-suite as --cluster-version.
    type: string
    default: "gsoci.azurecr.io/giantswarm/kind-node:v1.36.4"
  kind_config:
    description: |
      Path, relative to the checkout, of a kind Cluster configuration (kind.x-k8s.io/v1alpha4) passed
      to `kind create cluster --config` on the kind path. Empty (the default) creates
      the cluster the job creates without it. The job keeps naming the cluster and choosing the node
      image: kind's --name and --image take precedence over the configuration's `name` and
      `nodes[].image`, so the file carries only what the job does not decide (featureGates,
      runtimeConfig, kubeadm or containerd patches, extra nodes).
    type: string
    default: ""
  kind_registry_credentials:
    description: |
      On the kind path, give the kind node the registry credentials of the job so
      the chart under test can pull private images (gsociprivate.azurecr.io and any other registry
      listed in REGISTRIES_DATA_BASE64). The credentials come from the same architect context the
      push-to-registries jobs use; the job therefore needs `context: architect`. They are written to
      /var/lib/kubelet/config.json on the node, which the kubelet reads for every image pull, so the
      chart needs no imagePullSecrets. Skipped with a notice when the context is not attached.
    type: boolean
    default: true
steps:
  - attach_workspace:
      at: build
  - run:
      name: "architect/run-tests-with-ats: Skip a branch pipeline at a release commit"
      environment:
        PARAM_CHART_ARCHIVE_PREFIX: << parameters.chart_archive_prefix >>
      command: <<include(scripts/run-tests-with-ats-skip-release-commit.sh)>>
  - when:
      condition: << parameters.create_kind_cluster >>
      steps:
        - run:
            name: "architect/run-tests-with-ats: Warn about the deprecated create_kind_cluster"
            command: |
              echo "WARNING: create_kind_cluster is deprecated. app-test-suite_container_tag picks the path:"
              echo "a 1.x tag takes the kind path without it. Drop the parameter from the job."
  # The path follows app-test-suite_container_tag: 0.x is the legacy dats.sh path, anything else
  # (1.x, latest) the kind path. create_kind_cluster (deprecated) forces the kind path.
  # This condition and the kind path's below are complements: change both together.
  - when:
      condition:
        and:
          - not: << parameters.create_kind_cluster >>
          - matches:
              pattern: '^v?0\..*$'
              value: << parameters.app-test-suite_container_tag >>
      steps:
        - run:
            name: "Download dats.sh script"
            command: |
              wget -O dats.sh "https://raw.githubusercontent.com/giantswarm/app-test-suite/<< parameters.app-test-suite_version >>/dats.sh"
              chmod +x dats.sh
        - run:
            name: "Execute app-test-suite with dats.sh wrapper"
            command: |
              set -x

              export DATS_TAG=<< parameters.app-test-suite_container_tag >>
              # find the chart archive file name
              chart_archive=$(find build -name "<< parameters.chart_archive_prefix >>*.tgz" -print -quit)
              # move chart archive from build directory to root
              # we're doing this to make sure .ats/main.yaml is picked up
              cp "$chart_archive" "${chart_archive##*/}"

              # execute dats wrapper
              ./dats.sh --chart-file "${chart_archive##*/}" << parameters.additional_app-test-suite_flags >>
  # Complement of the legacy path's condition above: change both together.
  - when:
      condition:
        or:
          - << parameters.create_kind_cluster >>
          - not:
              matches:
                pattern: '^v?0\..*$'
                value: << parameters.app-test-suite_container_tag >>
      steps:
        - run:
            name: "Install kind"
            command: |
              URL="https://kind.sigs.k8s.io/dl/<< parameters.kind_version >>/kind-linux-amd64"
              echo "URL: $URL"
              curl -Ls --output ./kind --retry 3 --retry-all-errors "$URL"
              chmod +x ./kind
              sudo mv ./kind /usr/local/bin/kind
              kind version
        - run:
            name: "Create kind cluster"
            command: |
              # The kubeconfig lands in the working directory, which is mounted into the
              # app-test-suite container as /ats/workdir; kind's API server listens on
              # 127.0.0.1, which the container reaches through --network host.
              #
              # A kind configuration from the checkout (kind_config) shapes the cluster: feature
              # gates, runtime config, patches, extra nodes. The job's --name and --image take
              # precedence over the configuration's name and nodes[].image. Empty: no --config,
              # the cluster is created exactly as without the parameter.
              kind_config="<< parameters.kind_config >>"
              if [ -n "$kind_config" ] && [ ! -f "$kind_config" ]; then
                echo "kind_config '$kind_config' does not exist in the checkout" >&2
                exit 1
              fi
              tries=3
              for i in $(seq 1 $tries); do
                echo "====> Attempt $i: creating kind cluster 'ats'"
                if kind create cluster --name ats --image "<< parameters.kind_node_image >>" ${kind_config:+--config "$kind_config"} --kubeconfig ./kube.config --wait 120s; then
                  exit 0
                fi
                kind delete cluster --name ats --kubeconfig ./kube.config || true
                sleep 5
              done
              echo "kind cluster creation failed after $tries attempts" >&2
              exit 1
        - when:
            condition: << parameters.kind_registry_credentials >>
            steps:
              - run:
                  name: "Give the kind node the job's registry credentials"
                  command: |
                    # Same input as architect/image-login-to-registries: one registry per line,
                    # "visibility registry username_envvar password_envvar push_dev_image".
                    if [ -z "${REGISTRIES_DATA_BASE64:-}" ]; then
                      echo "REGISTRIES_DATA_BASE64 is not set (job runs without the architect context); the kind node gets no registry credentials, private images cannot be pulled."
                      exit 0
                    fi
                    echo "${REGISTRIES_DATA_BASE64}" | base64 -d > .registries_data

                    # No xtrace from here on: the loop resolves passwords.
                    set +x
                    config='{"auths":{'
                    sep=""
                    while read -r _ reg username password _; do
                      [ -n "$reg" ] || continue
                      case "$username" in *[!a-zA-Z0-9_]*) echo "Invalid username variable name: $username"; exit 1 ;; esac
                      case "$password" in *[!a-zA-Z0-9_]*) echo "Invalid password variable name: $password"; exit 1 ;; esac
                      eval "username_val=\${$username:-}"
                      eval "password_val=\${$password:-}"
                      if [ -z "$username_val" ] || [ -z "$password_val" ]; then
                        echo "No credentials for $reg in the environment, skipping it."
                        continue
                      fi
                      auth=$(printf '%s:%s' "$username_val" "$password_val" | base64 -w0)
                      config="${config}${sep}\"${reg}\":{\"auth\":\"${auth}\"}"
                      sep=","
                      echo "Registry credentials for $reg added."
                    done < .registries_data
                    config="${config}}}"
                    rm -f .registries_data

                    # The kubelet reads this file (docker config format) for every image pull, so
                    # pods need no imagePullSecrets. Written straight into the node container.
                    umask 077
                    printf '%s' "$config" > kubelet-config.json
                    docker cp kubelet-config.json ats-control-plane:/var/lib/kubelet/config.json
                    docker exec ats-control-plane chmod 600 /var/lib/kubelet/config.json
                    rm -f kubelet-config.json
        - run:
            name: "Execute app-test-suite"
            command: |
              set -x

              # find the chart archive file name
              chart_archive=$(find build -name "<< parameters.chart_archive_prefix >>*.tgz" -print -quit)
              # move chart archive from build directory to root
              # we're doing this to make sure .ats/main.yaml is picked up
              cp "$chart_archive" "${chart_archive##*/}"

              # the Kubernetes version label comes from the node image tag: ...:v1.36.4 -> 1.36.4
              node_image="<< parameters.kind_node_image >>"
              cluster_version="${node_image##*:}"
              cluster_version="${cluster_version%%@*}"
              cluster_version="${cluster_version#v}"

              # run the app-test-suite image directly; app-test-suite >= 1.0 needs neither the
              # Docker socket nor a DOCKER_GID, it only talks to the cluster in kube.config
              docker run --rm \
                -e USE_UID="$(id -u)" \
                -e USE_GID="$(id -g)" \
                -v "$(pwd):/ats/workdir" \
                --network host \
                "gsoci.azurecr.io/giantswarm/app-test-suite:<< parameters.app-test-suite_container_tag >>" \
                --chart-file "${chart_archive##*/}" \
                --cluster-kubeconfig kube.config \
                --cluster-type kind \
                --cluster-version "$cluster_version" \
                << parameters.additional_app-test-suite_flags >>
        - run:
            name: "Delete kind cluster"
            when: always
            command: |
              kind delete cluster --name ats --kubeconfig ./kube.config || true
