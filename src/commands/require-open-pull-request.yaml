# Halts the job unless an open pull request covers the commit being built.
#
# Why this exists: a scratch branch should cost no CI time and no registry
# space, but a branch that is under review must produce a dev image and a dev
# chart on every push, because a reserved management cluster follows them. The
# pull request being open is the whole rule — there is no label and no branch
# prefix.
#
# The build jobs call this as their first step, so a gated-off job costs the
# executor spin-up and nothing else. `circleci-agent step halt` ends the job
# successfully, which leaves the workflow green but also means every gated job
# has to ask for itself: a halted job does not skip the jobs that require it.
#
# The gate fails OPEN. A missing token, a GitHub outage or a rate limit builds
# the commit and says so: a spare build wastes minutes, a missed one leaves a
# reviewer — or a reserved cluster — with no chart at all.
#
# The logic is src/scripts/require-open-pull-request.sh, tested by
# src/tests/require-open-pull-request.bats.
steps:
  - generate-github-token:
      non_fatal: true
  - run:
      name: "architect/require-open-pull-request: Halt unless an open pull request covers this commit"
      command: <<include(scripts/require-open-pull-request.sh)>>
