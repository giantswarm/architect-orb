environment:
  DOCKER_BUILDKIT: "1"
executor: "architect"
resource_class: "<< parameters.resource_class >>"
parameters:
  image:
    description: Name of the  container repository and image. Defaults to `giantswarm/REPO_NAME`. Must not contain registry host name!
    type: string
    default: "giantswarm/${CIRCLE_PROJECT_REPONAME}"
  tag-latest-branch:
    description: 'Name of the branch on which the image will be additionally tagged as "latest".'
    type: string
    default: ""
  resource_class:
    default: small
    description: |
      Configures the amount of CPU and RAM for the job. See
      https://circleci.com/docs/2.0/configuration-reference/#docker-executor
      for details.
    type: enum
    enum: ["small", "medium", "medium+", "large", "xlarge", "arm.medium", "arm.large", "arm.xlarge", "arm.2xlarge"]
  build-context:
    type: string
    default: "."
  dockerfile:
    type: string
    default: "./Dockerfile"
  git-tag-prefix:
    type: string
    default: ""
  tag-suffix:
    type: string
    default: ""
  force-public:
    description: Skip the repo visibility check and push the the image to public registries
    type: boolean
    default: false
  split-china-push:
    description: Use self-hosted CircleCI runner in China for pushing image to Aliyun.
    type: boolean
    default: false
  registries-data:
    default: ""
    type: string
  platforms:
    description: |
      Comma-separated list of platforms for the buildx build. When empty, the list is
      auto-derived from the `.platforms` file written by `go-build` to the workspace.
      Falls back to `linux/amd64,linux/arm64` if neither is available.

      With `merge-digests: true` it is resolved the same way and names the platforms
      whose digests are joined; it must match the set of `build-image` jobs exactly, or
      the job fails rather than publishing an index that is quietly missing an
      architecture.
    type: string
    default: ""
  merge-digests:
    description: |
      Opt in to the native per-architecture build. Instead of building the image
      here, join the per-platform digests that `build-image` jobs recorded in the
      workspace into one tagged OCI index per registry (`docker buildx imagetools
      create`), then sign and attest it exactly as the single-job build does.
      Point this job at the `build-image` jobs with `requires:` and keep its
      name, so downstream `requires:` edges keep resolving.

      Off (default): the job builds every platform in one `docker buildx build`,
      as before. Nothing changes for configs that do not set this.

      On: `build-context`, `dockerfile`, `hadolint`, `hadolint-config`, `push`,
      `provenance`, `cache` and `cache-ref` describe the build, which now happens
      in the `build-image` jobs, and are ignored here. `platforms` must match the
      set of `build-image` jobs; `split-china-push` and `force-public` must carry
      the same values as on those jobs. See
      https://github.com/giantswarm/architect-orb/blob/main/docs/job/push-to-registries.md#native-per-architecture-builds-opt-in
    type: boolean
    default: false
  annotations:
    description: |
      Newline-separated OCI annotations passed to 'docker buildx build --annotation'.
      Each line uses the buildx format '[type:]key=value'. For multi-arch builds:
        manifest:key=value            - annotates each platform manifest
        index:key=value               - annotates the manifest list (OCI index)
        manifest-descriptor:key=value - annotates descriptors in the index
        key=value (no prefix)         - defaults to index for multi-platform builds
    type: string
    default: ""
  oci-labels:
    description: |
      Emit standard OCI image labels (and matching index annotations):
      org.opencontainers.image.{source,revision,version,created}.
    type: boolean
    default: true
  provenance:
    description: |
      Buildx SLSA provenance attestation mode: "min" (default), "max", or "false".
    type: enum
    enum: ["min", "max", "false"]
    default: "min"
  sbom:
    description: |
      Generate and attach an SPDX SBOM attestation per platform. On public images with
      `sign: true`, the exact SPDX predicate buildx produced is also signed as a cosign
      keyless attestation (`--type spdxjson`).
    type: boolean
    default: true
  sbom-cyclonedx:
    description: |
      Additionally generate a CycloneDX SBOM per architecture (with syft). BuildKit's SBOM
      attestation only emits SPDX, so CycloneDX is produced out-of-band. On public images
      with `sign: true` it is signed as a cosign keyless attestation (`--type cyclonedx`);
      otherwise (private images, or `sign: false`) it is attached unsigned as an OCI
      referrer (with oras). Defaults to off. Requires syft and oras in the architect image.
    type: boolean
    default: false
  sign:
    description: |
      Sign the pushed image — and its SPDX / CycloneDX SBOM attestations — with cosign
      keyless OIDC. Public images only — private images are skipped at runtime to avoid
      leaking digests/timestamps into the public Rekor transparency log. Mints a fresh
      CircleCI OIDC token with audience=sigstore via `circleci run oidc get`.
    type: boolean
    default: true
  hadolint:
    description: |
      Lint the Dockerfile with hadolint before building.
      - "warn" (default): run hadolint, print findings, never fail the job.
      - "fail": run hadolint and fail the job on any finding.
      - "skip": don't run hadolint at all.
    type: enum
    enum: ["warn", "fail", "skip"]
    default: "warn"
  hadolint-config:
    description: |
      Optional path to a `.hadolint.yaml` configuration file. When empty,
      hadolint uses its built-in defaults.
    type: string
    default: ""
  push:
    description: |
      Push the built image to the configured registries (default). Set to false to only
      validate that the image builds for every target platform — same Dockerfile lint,
      same multi-arch buildx build (QEMU, `.platforms` auto-derivation, workspace attach),
      but the result stays in the BuildKit cache. No registry credentials are used and
      signing / provenance / SBOM generation are skipped. Useful on the branch/PR path of
      workflows that push images only on release tags.
    type: boolean
    default: true
  cache:
    description: |
      BuildKit layer-cache backend. "off" (default) keeps the previous behaviour: the
      builder is created fresh on a fresh remote-docker VM every job, so the whole
      Dockerfile is re-executed from scratch on every build. "registry" imports and
      exports the layer cache as an OCI artifact in the registry the image is pushed
      to. Requires `push: true`. `RUN --mount=type=cache` mounts are not part of the
      exported cache — only layers are.
    type: enum
    enum: ["off", "registry"]
    default: "off"
  cache-ref:
    description: |
      Explicit OCI ref for the `cache: registry` artifact. Defaults to
      `<registry>/<image>:buildcache<tag-suffix>`, where `<registry>` is the
      visibility-matched entry, preferring gsoci/gsociprivate and never the China mirror.
    type: string
    default: ""
steps:
  - checkout
  - setup_remote_docker:
      version: default
  - attach_workspace:
      at: .
  - image-prepare-tag:
      git-tag-prefix: <<parameters.git-tag-prefix>>
      tag-suffix: <<parameters.tag-suffix>>
  # The default path: build every platform in one `docker buildx build`, on this
  # machine, and push the tagged result. Unchanged.
  - unless:
      condition: <<parameters.merge-digests>>
      steps:
        - dockerfile-lint:
            dockerfile: <<parameters.dockerfile>>
            mode: <<parameters.hadolint>>
            config: <<parameters.hadolint-config>>
        - when:
            # Build-only mode needs no registry credentials.
            condition: <<parameters.push>>
            steps:
              - image-login-to-registries:
                  registries-data: <<parameters.registries-data>>
        - run:
            name: Validate platforms parameter
            command: |
              if [ -n "<<parameters.platforms>>" ] && [[ ! "<<parameters.platforms>>" =~ ^[a-zA-Z0-9/_,-]+$ ]]; then
                echo "ERROR: The 'platforms' parameter, if set, must be a comma-separated list of valid platform strings (e.g., linux/amd64,linux/arm64)."
                exit 1
              fi
        - run:
            name: Validate cache-ref parameter
            command: |
              # Interpolated straight into a --cache-to/--cache-from attribute list, so keep it
              # to the OCI reference charset (host[:port]/path:tag). A `,` would silently inject
              # a further exporter attribute.
              if [ -n "<<parameters.cache-ref>>" ] && [[ ! "<<parameters.cache-ref>>" =~ ^[a-zA-Z0-9._:/-]+$ ]]; then
                echo "ERROR: 'cache-ref', if set, must be a plain OCI reference (e.g. registry.example.com/org/image:buildcache)."
                exit 1
              fi
        - image-build-and-push:
            image: <<parameters.image>>
            build-context: <<parameters.build-context>>
            dockerfile: <<parameters.dockerfile>>
            force-public: <<parameters.force-public>>
            tag-latest-branch: <<parameters.tag-latest-branch>>
            tag-suffix: <<parameters.tag-suffix>>
            registries-data: <<parameters.registries-data>>
            platforms: <<parameters.platforms>>
            annotations: <<parameters.annotations>>
            oci-labels: <<parameters.oci-labels>>
            provenance: <<parameters.provenance>>
            sbom: <<parameters.sbom>>
            sbom-cyclonedx: <<parameters.sbom-cyclonedx>>
            sign: <<parameters.sign>>
            split-china-push: <<parameters.split-china-push>>
            push: <<parameters.push>>
            cache: <<parameters.cache>>
            cache-ref: <<parameters.cache-ref>>
        - when:
            condition:
              and:
                - <<parameters.split-china-push>>
                - <<parameters.push>>
            steps:
              - save_cache:
                  key: image-data-{{.Environment.CIRCLE_PIPELINE_ID}}
                  paths:
                    - /tmp/.docker_image_registry
                    - /tmp/.docker_image_tag
  # The opt-in path: the `build-image` jobs this job requires each built one
  # platform natively and left its digest in the workspace. Join them into one
  # tagged index per registry, then sign and attest that index with the same
  # command the default path uses.
  - when:
      condition: <<parameters.merge-digests>>
      steps:
        - image-login-to-registries:
            registries-data: <<parameters.registries-data>>
        - generate-github-token
        # The build jobs each resolved the same set to decide where to push; this
        # resolves it again to decide where to merge, sign and attest. Same
        # command, same inputs, same answer: the visibility check and the
        # push_dev gate are deterministic for a given commit and tag.
        - image-select-registries:
            force-public: <<parameters.force-public>>
            registries-data: <<parameters.registries-data>>
            split-china-push: <<parameters.split-china-push>>
        - image-merge-manifests:
            image: <<parameters.image>>
            platforms: <<parameters.platforms>>
            tag-latest-branch: <<parameters.tag-latest-branch>>
            tag-suffix: <<parameters.tag-suffix>>
            annotations: <<parameters.annotations>>
            oci-labels: <<parameters.oci-labels>>
        - image-sign-and-attest:
            image: <<parameters.image>>
            push: true
            sign: <<parameters.sign>>
            sbom: <<parameters.sbom>>
            sbom-cyclonedx: <<parameters.sbom-cyclonedx>>
        - when:
            # sync-china-registry restores this to learn what to mirror.
            condition: <<parameters.split-china-push>>
            steps:
              - save_cache:
                  key: image-data-{{.Environment.CIRCLE_PIPELINE_ID}}
                  paths:
                    - /tmp/.docker_image_registry
                    - /tmp/.docker_image_tag
