executor: "architect"
resource_class: "<< parameters.resource_class >>"
parameters:
  image:
    description: Name of the container repository and image. Defaults to `giantswarm/REPO_NAME`. Must not contain registry host name!
    type: string
    default: "giantswarm/${CIRCLE_PROJECT_REPONAME}"
  platforms:
    description: |
      The platforms that were built. Every one must have left a digest in the
      workspace, and no digest may be left over, or the job fails rather than
      publishing an index that is quietly missing an architecture. Must match the
      set of `build-image` jobs this job requires.
    type: string
    default: "linux/amd64,linux/arm64"
  resource_class:
    description: |
      This job does no building — it assembles manifests, signs, and fetches SBOM
      blobs. `small` is the right default; raise it only if a very large SBOM makes
      the signing steps memory-bound.
    type: enum
    enum: ["small", "medium", "medium+", "large", "xlarge", "arm.medium", "arm.large", "arm.xlarge", "arm.2xlarge"]
    default: small
  tag-latest-branch:
    description: 'Name of the branch on which the image will be additionally tagged as "latest".'
    type: string
    default: ""
  git-tag-prefix:
    type: string
    default: ""
  tag-suffix:
    type: string
    default: ""
  force-public:
    description: Skip the repo visibility check and push the image to public registries.
    type: boolean
    default: false
  registries-data:
    type: string
    default: ""
  split-china-push:
    description: |
      Use a self-hosted CircleCI runner in China for pushing to Aliyun. Must match
      the value on the `build-image` jobs, or they and this job disagree about
      which registries hold the per-architecture digests.
    type: boolean
    default: false
  annotations:
    description: |
      Newline-separated OCI annotations for the merged index. Only `index:`,
      `index-descriptor:` and `manifest-descriptor:` prefixes are accepted;
      per-platform `manifest:` annotations belong on the `build-image` jobs.
    type: string
    default: ""
  oci-labels:
    description: |
      Emit org.opencontainers.image.{source,revision,version,created} as index
      annotations. The merge builds a new index, so the per-architecture ones are
      discarded with it and these have to be re-applied here.
    type: boolean
    default: true
  sbom:
    description: |
      Sign the SPDX SBOM attestation that `build-image` attached to each platform.
    type: boolean
    default: true
  sbom-cyclonedx:
    description: |
      Additionally generate a CycloneDX SBOM per architecture (with syft). BuildKit's SBOM
      attestation only emits SPDX, so CycloneDX is produced out-of-band. On public images
      with `sign: true` it is signed as a cosign keyless attestation (`--type cyclonedx`);
      otherwise (private images, or `sign: false`) it is attached unsigned as an OCI
      referrer (with oras). Defaults to off. Requires syft and oras in the architect image.
    type: boolean
    default: false
  sign:
    description: |
      Sign the pushed index — and its SPDX / CycloneDX SBOM attestations — with cosign
      keyless OIDC. Public images only — private images are skipped at runtime to avoid
      leaking digests/timestamps into the public Rekor transparency log. Mints a fresh
      CircleCI OIDC token with audience=sigstore via `circleci run oidc get`.
    type: boolean
    default: true
steps:
  - checkout
  # Only `docker login` needs this. Everything else here talks to the registry
  # client-side: imagetools create/inspect, oras, cosign and syft all read
  # credentials from ~/.docker/config.json and never touch a daemon — imagetools
  # works with no daemon at all. Swapping image-login-to-registries for `oras
  # login`, which writes the same file, would let the VM go, but that command is
  # shared with sync-china-registry, so it is not a local change.
  - setup_remote_docker:
      version: default
  - attach_workspace:
      at: .
  # This job is the only one on the release path that is not concurrent with
  # another, so it is the one that publishes `.build_version`.
  - image-prepare-tag:
      git-tag-prefix: <<parameters.git-tag-prefix>>
      tag-suffix: <<parameters.tag-suffix>>
  - image-login-to-registries:
      registries-data: <<parameters.registries-data>>
  - generate-github-token
  # The build jobs each resolved the same set to decide where to push; this
  # resolves it again to decide where to merge, sign and attest. Same command,
  # same inputs, same answer — the visibility check and the push_dev gate are
  # deterministic for a given commit and tag.
  - image-select-registries:
      force-public: <<parameters.force-public>>
      registries-data: <<parameters.registries-data>>
      split-china-push: <<parameters.split-china-push>>
  - image-merge-manifests:
      image: <<parameters.image>>
      platforms: <<parameters.platforms>>
      tag-latest-branch: <<parameters.tag-latest-branch>>
      tag-suffix: <<parameters.tag-suffix>>
      annotations: <<parameters.annotations>>
      oci-labels: <<parameters.oci-labels>>
  - image-sign-and-attest:
      image: <<parameters.image>>
      push: true
      sign: <<parameters.sign>>
      sbom: <<parameters.sbom>>
      sbom-cyclonedx: <<parameters.sbom-cyclonedx>>
  - when:
      # sync-china-registry restores this to learn what to mirror.
      condition: <<parameters.split-china-push>>
      steps:
        - save_cache:
            key: image-data-{{.Environment.CIRCLE_PIPELINE_ID}}
            paths:
              - /tmp/.docker_image_registry
              - /tmp/.docker_image_tag
