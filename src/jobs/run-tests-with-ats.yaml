parameters:
  chart_archive_prefix:
    description: "Prefix for the chart archive file to execute tests for."
    type: string
    default: ""
  app-test-suite_version:
    description: "Version of app-test-suite dats.sh container wrapper to use (git tag or commit). Legacy path only: ignored on the kind path."
    type: string
    default: "v0.15.0"
  app-test-suite_container_tag:
    description: |
      Container tag of app-test-suite to use (check gsoci.azurecr.io/giantswarm/app-test-suite). The
      tag picks the path: 0.x takes the legacy dats.sh path, any other tag (1.x) creates a kind
      cluster in the job and runs the image directly against it. See the command parameter.
    type: string
    default: "0.15.0"
  additional_app-test-suite_flags:
    description: "Additional app-test-suite flags to use"
    type: string
    default: ""
  create_kind_cluster:
    description: |
      Deprecated: app-test-suite_container_tag picks the path. True forces the kind path also for a
      0.x tag; false (the default) leaves the choice to the tag.
    type: boolean
    default: false
  kind_version:
    description: "kind release to install on the kind path (https://github.com/kubernetes-sigs/kind/releases)."
    type: string
    default: "v0.33.0"
  kind_node_image:
    description: |
      Node image of the kind cluster created on the kind path. The Kubernetes
      version in its tag is passed to app-test-suite as --cluster-version.
    type: string
    default: "gsoci.azurecr.io/giantswarm/kind-node:v1.37.0"
  kind_config:
    description: |
      Path, relative to the checkout, of a kind Cluster configuration passed to `kind create cluster
      --config` on the kind path (feature gates, runtime config, patches, extra nodes;
      the job's --name and --image take precedence). Empty creates the cluster as before. See the
      command parameter.
    type: string
    default: ""
  kind_registry_credentials:
    description: |
      Give the kind node the job's registry credentials (REGISTRIES_DATA_BASE64 from the architect
      context) so the chart under test can pull private images. See the command parameter.
    type: boolean
    default: true
  resource_class:
    default: "medium"
    description: |
        Configures amount CPU and RAM for the job. See
        https://circleci.com/docs/2.0/configuration-reference/#machine-executor-linux
        for details.
    type: "enum"
    enum: ["medium", "large", "xlarge", "2xlarge"]
executor: "machine"
resource_class: "<< parameters.resource_class >>"
steps:
  - checkout
  - run-tests-with-ats:
      chart_archive_prefix: << parameters.chart_archive_prefix >>
      app-test-suite_version: << parameters.app-test-suite_version >>
      app-test-suite_container_tag: << parameters.app-test-suite_container_tag >>
      additional_app-test-suite_flags: << parameters.additional_app-test-suite_flags >>
      create_kind_cluster: << parameters.create_kind_cluster >>
      kind_version: << parameters.kind_version >>
      kind_node_image: << parameters.kind_node_image >>
      kind_config: << parameters.kind_config >>
      kind_registry_credentials: << parameters.kind_registry_credentials >>
