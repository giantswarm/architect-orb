parameters:
  chart_archive_prefix:
    description: "Prefix for the chart archive file to execute tests for."
    type: string
    default: ""
  app-test-suite_version:
    description: "Version of app-test-suite dats.sh container wrapper to use (git tag or commit). Legacy path only: ignored when create_kind_cluster is true."
    type: string
    default: "v0.15.0"
  app-test-suite_container_tag:
    description: "Container tag of app-test-suite to use (check gsoci.azurecr.io/giantswarm/app-test-suite)"
    type: string
    default: "0.15.0"
  additional_app-test-suite_flags:
    description: "Additional app-test-suite flags to use"
    type: string
    default: ""
  create_kind_cluster:
    description: |
      Create a kind cluster in the job and run the app-test-suite image directly against it
      (app-test-suite >= 1.0, which no longer provisions clusters and no longer ships dats.sh).
      When false, the legacy path downloads dats.sh at app-test-suite_version and lets
      app-test-suite <= 0.15 create its own kind cluster through the Docker socket.
    type: boolean
    default: false
  kind_version:
    description: "kind release to install when create_kind_cluster is true (https://github.com/kubernetes-sigs/kind/releases)."
    type: string
    default: "v0.33.0"
  kind_node_image:
    description: |
      Node image of the kind cluster created when create_kind_cluster is true. The Kubernetes
      version in its tag is passed to app-test-suite as --cluster-version.
    type: string
    default: "gsoci.azurecr.io/giantswarm/kind-node:v1.36.4"
  resource_class:
    default: "medium"
    description: |
        Configures amount CPU and RAM for the job. See
        https://circleci.com/docs/2.0/configuration-reference/#machine-executor-linux
        for details.
    type: "enum"
    enum: ["medium", "large", "xlarge", "2xlarge"]
executor: "machine"
resource_class: "<< parameters.resource_class >>"
steps:
  - checkout
  - run-tests-with-ats:
      chart_archive_prefix: << parameters.chart_archive_prefix >>
      app-test-suite_version: << parameters.app-test-suite_version >>
      app-test-suite_container_tag: << parameters.app-test-suite_container_tag >>
      additional_app-test-suite_flags: << parameters.additional_app-test-suite_flags >>
      create_kind_cluster: << parameters.create_kind_cluster >>
      kind_version: << parameters.kind_version >>
      kind_node_image: << parameters.kind_node_image >>
