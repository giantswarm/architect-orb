executor: "regctl"
resource_class: giantswarm/galaxy-runner
parameters:
  image:
    description: Name of the  container repository and image. Defaults to `giantswarm/REPO_NAME`. Must not contain registry host name!
    type: string
    default: "giantswarm/${CIRCLE_PROJECT_REPONAME}"
  registries-data:
    default: ""
    type: string
  replica-wait-minutes:
    description: |
      How long to wait for the image to become visible from this runner before the
      copy starts. gsoci.azurecr.io is geo-replicated and the in-China runner reads
      the Southeast Asia replica, which receives a pushed image asynchronously: the
      index within seconds, each platform manifest only once its layers are across,
      which for a multi-GiB image can take tens of minutes. Nothing else in the
      pipeline depends on this job, so waiting costs only runner time; on timeout the
      job fails and a rerun from failed picks the copy up once the image has arrived.
    type: integer
    default: 60
steps:
  - image-login-to-registries:
      client: "regctl"
      registries-data: <<parameters.registries-data>>
  - restore_cache:
      keys:
        - image-data-{{.Environment.CIRCLE_PIPELINE_ID}}
  - image-wait-for-replica:
      image: <<parameters.image>>
      timeout-minutes: <<parameters.replica-wait-minutes>>
  - image-copy-to-china:
      image: <<parameters.image>>
