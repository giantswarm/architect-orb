version: 2.1

orbs:
  architect: giantswarm/architect@10.6.3
  orb-tools: circleci/orb-tools@12.5.0
  bats: circleci/bats@1.1.0

workflows:
  catalog_build:
    jobs:
      - architect/changelog-lint

      - orb-tools/lint:
          filters:
            tags:
              only: /.*/

      - orb-tools/pack:
          requires:
            - "orb-tools/lint"
          filters:
            tags:
              only: /.*/

      # The scripts the commands include (src/scripts) against their tests
      # (src/tests), in the executor the commands run in, so the gitsemver and
      # git the tests exercise are the ones a consuming job has.
      - bats/run:
          name: test
          path: ./src/tests
          exec_environment: architect/architect
          filters:
            tags:
              only: /.*/

      - orb-tools/publish:
          name: publish-branch
          orb_name: giantswarm/architect
          vcs_type: github
          enable_pr_comment: false
          circleci_token: CIRCLECI_DEV_API_TOKEN
          # Tags are expanded with `circleci env subst`; dev:${CIRCLE_BRANCH}
          # gives a stable per-branch reference for testing in consuming repos.
          dev_tags: dev:${CIRCLE_SHA1},dev:alpha,dev:${CIRCLE_BRANCH}
          requires:
            - "orb-tools/pack"
            - test
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

      - orb-tools/publish:
          name: publish-tag
          orb_name: giantswarm/architect
          vcs_type: github
          enable_pr_comment: false
          circleci_token: CIRCLECI_DEV_API_TOKEN
          pub_type: production
          requires:
            - "orb-tools/pack"
            - test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
